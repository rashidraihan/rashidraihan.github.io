<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline - Raihan Rashid</title>
  <style>
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #f8f9fa;
      color: #121212;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      text-align: center;
      line-height: 1.6;
    }
    body.dark {
      background-color: #0a0a14;
      color: #e0e0e0;
    }
    .offline-container {
      max-width: 400px;
      padding: 2rem;
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    }
    body.dark .offline-container {
      background: #151522;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }
    h1 {
      color: #2563eb;
      margin-bottom: 1rem;
    }
    body.dark h1 {
      color: #3dd68c;
    }
    p {
      margin-bottom: 1.5rem;
      color: #666;
    }
    body.dark p {
      color: #aaa;
    }
    .emoji {
      font-size: 3rem;
      margin-bottom: 1rem;
    }
    .retry-button {
      background-color: #2563eb;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 1rem;
      transition: background-color 0.3s ease;
    }
    body.dark .retry-button {
      background-color: #3dd68c;
    }
    .retry-button:hover {
      background-color: #1d4ed8;
    }
    body.dark .retry-button:hover {
      background-color: #2eb67d;
    }
  </style>
</head>
<body>
  <div class="offline-container">
    <div class="emoji">📶</div>
    <h1>You're Offline</h1>
    <p>It looks like you're not connected to the internet. You're viewing a cached version of the site.</p>
    <p>Some features may not be available until you're back online.</p>
    <button class="retry-button" onclick="window.location.reload()">Retry Connection</button>
  </div>
  
  <script>
    // Check if dark mode was enabled
    if (localStorage.getItem('theme') === 'dark') {
      document.body.classList.add('dark');
    }
    
    // Check for connectivity changes
    window.addEventListener('online', function() {
      window.location.reload();
    });
  </script>
</body>
</html>
